name: Bump add-on patch version

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: addon-version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Test version bump helper
        run: python -m unittest discover -s .github/tests -p test_bump_version.py -v

      - name: Bump patch version and UTC release date
        id: version
        run: |
          version=$(python .github/bump-version.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create or update version bump PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.VERSION_BUMP_TOKEN || github.token }}
          base: ${{ github.event.repository.default_branch }}
          branch: automation/bump-addon-version-${{ steps.version.outputs.version }}
          delete-branch: true
          add-paths: |
            __init__.py
            blender_manifest.toml
          commit-message: |
            chore: bump add-on version to ${{ steps.version.outputs.version }}

            Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>
          title: "chore: bump add-on version to ${{ steps.version.outputs.version }}"
          body: |
            Increment the add-on patch version and set the release date to today's UTC date (YYMMDD).

            Updated declarations:
            - `bl_info["version"]` in `__init__.py`
            - `VERSION` in `__init__.py`
            - `version` in `blender_manifest.toml`

            Release workflow version input after merging: `${{ steps.version.outputs.version }}`

            This PR only prepares version metadata; it does not publish a release.
            If created with the default GITHUB_TOKEN, run the PR workflow manually on
            `automation/bump-addon-version-${{ steps.version.outputs.version }}`,
            since that token does not trigger PR workflows.
