[project]
requires-python = ">=3.10,<3.13" # in order to support numpy<2.0.0
dependencies = [
    "requests>=2.18.4",
    "types-requests>=2.31.0.5",
    "numpy>=1.21.0,<2.0.0",
]

# these will not be included in build distributions
[dependency-groups]
dev = [
    ## dev dependencies
    "ruff==0.15.6",
    "pydoclint==0.8.3",
    "mypy==1.13.0",

    ## I would like to enable these in the future
    "bandit>=1.9.4", # code is currently invalid for bandit
]

[tool.ruff]
required-version = "==0.15.6"
target-version = "py310"
line-length = 88
force-exclude = true
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "dist",
  "node_modules",
  "venv",
]
extend-exclude = [
  "lib",
  "out",
    "client",
    "**/_bck/**",
  "*.tmp",
  "bk_client",
  "bk_proxor",
]

[tool.ruff.format]
line-ending = "auto"

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.per-file-ignores]
"./__init__.py" = ["I001"]

[tool.ruff.lint.isort]
lines-after-imports = 2


[tool.mypy]
exclude = ['test_*', 'tests', 'out', 'lib']
disallow_untyped_globals = false # remove this in the future

[[tool.mypy.overrides]]
module = [
  "bpy",
  "bpy.*",
  "bpy_extras",
  "mathutils",
  "addonutils",
  "blf",
  "gpu",
  "gpu_extras.*"
]
ignore_missing_imports = true  # Ignore missing type hints for bpy

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
ignore-private-args = true
ignore-underscore-args = true
exclude = '(^|[\\/])(\.venv|venv|lib|out|client|bk_client|bk_proxor|_debug|_bck|__pycache__|\.git)([\\/]|$)'
